<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sampurn — Live FMCG Internship Tracker</title><style>
:root{--bg:#f5f7fb;--card:#fff;--ink:#162033;--muted:#667085;--line:#e4e7ec;--accent:#1769e0;--green:#16834b;--orange:#b54708}*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif;background:var(--bg);color:var(--ink)}.wrap{max-width:1280px;margin:auto;padding:28px 20px 60px}header{background:linear-gradient(135deg,#101828,#1d2939);color:white;border-radius:22px;padding:28px;margin-bottom:18px}h1{margin:0 0 8px;font-size:30px}.sub{color:#cfd6e4}.toolbar,.stats{display:grid;gap:10px}.toolbar{grid-template-columns:2fr 1fr 1fr 1fr;margin:18px 0}.toolbar input,.toolbar select{padding:12px;border:1px solid var(--line);border-radius:10px;background:white}.stats{grid-template-columns:repeat(5,1fr);margin:18px 0}.stat,.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px}.stat b{display:block;font-size:24px}.muted{color:var(--muted);font-size:13px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.card h3{margin:8px 0 3px;font-size:18px}.company{font-weight:700}.meta{color:var(--muted);font-size:13px;margin:10px 0}.desc{font-size:14px;line-height:1.45}.chips{display:flex;gap:6px;flex-wrap:wrap}.chip{font-size:11px;padding:5px 8px;border-radius:999px;background:#eef4ff;color:#174ea6}.new{background:#ecfdf3;color:#067647}.actions{display:flex;gap:8px;margin-top:14px}.actions a{flex:1;text-align:center;text-decoration:none;padding:9px;border-radius:9px;font-size:13px;font-weight:700}.apply{background:var(--accent);color:white}.career{border:1px solid var(--line);color:var(--ink)}.empty{padding:30px;text-align:center;color:var(--muted)}@media(max-width:900px){.grid{grid-template-columns:1fr 1fr}.toolbar{grid-template-columns:1fr 1fr}.stats{grid-template-columns:repeat(3,1fr)}}@media(max-width:600px){.grid{grid-template-columns:1fr}.stats{grid-template-columns:1fr 1fr}.toolbar{grid-template-columns:1fr}}
</style></head><body><div class="wrap"><header><h1>Live FMCG Internship Tracker</h1><div class="sub">Supply Chain • Operations • Procurement • Analytics — built around Sampurn's profile</div><div id="sync" class="sub" style="margin-top:10px">Loading live database…</div></header><div class="stats" id="stats"></div><div class="toolbar"><input id="q" placeholder="Search company, role, city…"><select id="cat"><option value="">All categories</option></select><select id="min"><option value="0">Any match</option><option value="85">85+ match</option><option value="90">90+ match</option><option value="95">95+ match</option></select><select id="fresh"><option value="">All jobs</option><option value="new">New since sync</option><option value="6m">6-month wording</option></select></div><div id="grid" class="grid"></div></div><script>
let jobs=[];const $=id=>document.getElementById(id);function esc(s=''){return s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function days(s){return Math.max(0,Math.floor((Date.now()-new Date(s).getTime())/86400000))}function render(){let q=$('q').value.toLowerCase(),cat=$('cat').value,min=+$('min').value,f=$('fresh').value;let x=jobs.filter(j=>(!q||`${j.company} ${j.title} ${j.location} ${j.description}`.toLowerCase().includes(q))&&(!cat||j.category===cat)&&j.score>=min&&(!f||(f==='new'?j.status==='new':/6[- ]month|six month/i.test(j.description+' '+j.missing+' '+j.location)))).sort((a,b)=>b.score-a.score);$('grid').innerHTML=x.length?x.map(j=>`<article class="card"><div class="chips"><span class="chip">${esc(j.category||'Discovery')}</span>${j.status==='new'?'<span class="chip new">NEW</span>':''}<span class="chip">${j.score}/100</span></div><h3>${esc(j.title)}</h3><div class="company">${esc(j.company)}</div><div class="meta">${esc(j.location||'India')} · First seen ${days(j.first_seen)}d ago</div><div class="desc">${esc(j.description||'')}</div><div class="actions"><a class="apply" href="${esc(j.apply_url||'#')}" target="_blank" rel="noopener">Direct Apply ↗</a>${j.career_url?`<a class="career" href="${esc(j.career_url)}" target="_blank" rel="noopener">Company Careers ↗</a>`:''}</div></article>`).join(''):'<div class="empty">No jobs match these filters.</div>'}function init(){let cats=[...new Set(jobs.map(j=>j.category).filter(Boolean))].sort();$('cat').innerHTML='<option value="">All categories</option>'+cats.map(c=>`<option>${esc(c)}</option>`).join('');['q','cat','min','fresh'].forEach(id=>$(id).addEventListener('input',render));let active=jobs.filter(j=>j.status!=='closed').length,newc=jobs.filter(j=>j.status==='new').length,high=jobs.filter(j=>j.score>=90).length,sc=jobs.filter(j=>/supply chain|planning|procurement|logistics|operations/i.test(j.title+' '+j.category)).length,city=jobs.filter(j=>/bengaluru|mumbai|gurugram|delhi|ahmedabad/i.test(j.location)).length;$('stats').innerHTML=[['Active',active],['New',newc],['90+ Match',high],['SC/Operations',sc],['India Cities',city]].map(a=>`<div class="stat"><b>${a[1]}</b><span class="muted">${a[0]}</span></div>`).join('');render()}fetch('data/jobs.json?ts='+Date.now()).then(r=>r.json()).then(x=>{jobs=x;fetch('data/sync.json?ts='+Date.now()).then(r=>r.json()).then(s=>{$('sync').textContent=`Last sync: ${s.last_sync||'seed'} · ${s.new_jobs||0} new jobs in latest run · Auto-refresh every 6 hours`}).catch(()=>{});init()}).catch(e=>{$('sync').textContent='Could not load live database.'})
</script></body></html>
